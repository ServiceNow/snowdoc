[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "snowdoc"
version = "0.1.0"
description = ""
authors = ["esakkivel.esakkiraja <esakkivel.esakkiraja@servicenow.com>"]
readme = "README.md"
packages = [
    { include = "snowdoc", from = "src" }
]

[tool.poetry.dependencies]
python = ">=3.11,<4"
click = ">=8.2.1,<9.0.0"
python-dotenv = "^1.1.0"
boto3 = "^1.38.34"
google-genai = "^1.19.0"
pandas = ">=2.0.0,<3.0.0"
openpyxl = ">=3.1.0,<4.0.0"
tqdm = ">=4.65.0,<5.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.0"
pytest-cov = "^6.1.1"
ruff = "^0.11.13"
build = "^1.2.2.post1"
twine = "^6.1.0"
click = ">=8.2.1,<9.0.0"
pandas = ">=2.0.0,<3.0.0"
openpyxl = ">=3.1.0,<4.0.0"

[tool.poetry.scripts]
snowdoc = "snowdoc.cli:main"
